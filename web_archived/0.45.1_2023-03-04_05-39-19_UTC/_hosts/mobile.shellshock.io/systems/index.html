<script>
var comp_item_grid = {
	template: '#item-grid-template',
	components: { 'item': comp_item },
	props: ['loc', 'items', 'selectedItem', 'gridClass', 'categoryLocKey', 'inShop', 'hasBuyBtn', 'inInventory'],
	data() {
		return vueData;
	},

	methods: {
		onItemSelected: function (selectedItem) {
			if (!vueApp.equipCalledInGame) {
				this.equipSlideActive = true;
				document.getElementById('equip_panel_left').classList.add('left-slide');
				document.getElementById('equip_panel_right').classList.add('right-slide');
			}
			this.$emit('item-selected', selectedItem);
			BAWK.play('ui_click');
		},

		isSelected: function (item) {
			if (!hasValue(this.selectedItem)) {
				return false;
			}

			return (this.selectedItem.id === item.id);
		},

		onSwitchToSkinsClick: function () {
			this.$emit('switch-to-skins');
			BAWK.play('ui_playconfirm');
		},

		isPremItemInStore() {
			let hasItem = false;
			for (let i = 0; i < this.items.length; i++) {
				const item = this.items[i];
					const isItem = vueApp.premiumShopItems.find(i => i.isActive && i.itemId.id === item.id);
					if (hasValue(isItem)) {
						hasItem = true;
						break;
					}
			}
			return hasItem;
		}
	},

	computed: {
		categoryName: function () {
			if (!hasValue(this.selectedItem)) {
				return null;
			}

			return this.loc['item_type_' + this.selectedItem.item_type_id];
		},

		hiddenPremItemCheck() {
			if (this.items.some(i => i.unlock === 'purchase') || this.items.length !== 0) return true;
			if (this.items.some(i => i.unlock === 'premium')) return this.isPremItemInStore();
			return false;
		},

		gridCls() {
			if (this.hasBuyBtn) {
				return 'grid-auto-flow-column gap-1';
			} else {
				return 'grid-column-3-eq align-content-start align-content-start gap-sm';
			}
		},
		itemsSorted() {
			return this.items.sort((b, a) => {
				// if (a.id === this.selectedItem.id && b.id !== this.selectedItem.id && !this.inShop) return 1;
				// if (a.id !== this.selectedItem.id && b.id === this.selectedItem.id && !this.inShop) return -1;
				if (a.unlock === 'premium' && b.unlock !== 'premium') return 1;
				if (a.unlock !== 'premium' && b.unlock === 'premium') return -1;
				if (a.unlock === 'vip' && b.unlock !== 'vip') return 1;
				if (a.unlock !== 'vip' && b.unlock === 'vip') return -1;
				if (a.unlock === 'physical' && b.unlock !== 'physical') return 1;
				if (a.unlock !== 'physical' && b.unlock === 'physical') return -1;
				if (a.unlock === 'manual' && b.unlock !== 'manual') return 1;
				if (a.unlock !== 'manual' && b.unlock === 'manual') return -1;
				if (a.unlock === 'default' && b.unlock !== 'default') return 1;
				if (a.unlock !== 'default' && b.unlock === 'default') return -1;
				if (a.unlock === 'purchase' && b.unlock !== 'purchase') return 1;
				if (a.unlock !== 'purchase' && b.unlock === 'purchase') return -1;
				return 0;
			});
		}
	}
};
</script>

<script>
var comp_equip_screen = {
	template: '#equip-screen-template',
	components: {
		'account-panel': comp_account_panel,
		'equipped-slots': comp_equipped_slots,
		'color-select': comp_color_select,
		'item-timer': comp_item_timer,
		'price-tag': comp_price_tag,
		'physical-tag': comp_physical_tag,
		'item-type-selector': comp_item_type_selector,
		'item-grid': comp_item_grid,
		'house-ad-small': comp_house_ad_small,
		'weapon-select-panel': comp_weapon_select_panel,
		'item': comp_item,
		'house-ad-small': comp_house_ad_small
	},

	data: function () {
		return vueData;
	},

	equippedItems: {},

	methods: {
		setup: function (itemType) {
			if (!itemType) { itemType = ItemType.Primary; }
			this.updateEquippedItems();
			this.poseEquippedItems();
			if (itemType === 'tagged') {
				this.populateItemGridWithTagged(this.equip.specialItemsTag);
			} else {
				this.populateItemGridWithType(itemType);
			}
			this.selectEquippedItemForType();
		},

		updateEquippedItems: function () {
			this.$options.equippedItems = extern.getEquippedItems();

			this.equip.equippedHat = this.$options.equippedItems[ItemType.Hat];
			this.equip.equippedStamp = this.$options.equippedItems[ItemType.Stamp];
			this.equip.equippedPrimary = this.$options.equippedItems[ItemType.Primary];
			// Update the equip item since mobiles ui is lacking
			// this.equip.selectedItem = this.equip.equippedPrimary;
			this.equip.equippedGrenade = this.$options.equippedItems[ItemType.Grenade];
			this.equip.equippedMelee = this.$options.equippedItems[ItemType.Melee];
			this.equip.equippedSecondary = this.$options.equippedItems[ItemType.Secondary];
		},

		poseEquippedItems: function () {
			this.posingHat = this.equip.equippedHat;
			this.posingStamp = this.equip.equippedStamp;

			switch (this.equip.showingWeaponType) {
				case ItemType.Primary:
					this.posingWeapon = this.equip.equippedPrimary;
					this.posingGrenade = null;
					this.posingMelee = null;
					break;
				case ItemType.Secondary:
					this.posingWeapon = this.equip.equippedSecondary;
					this.posingGrenade = null;
					this.posingMelee = null;
					break;
				case ItemType.Grenade:
					this.posingGrenade = this.equip.equippedGrenade;
					this.posingMelee = null;
					break;
				case ItemType.Melee:
					this.posingMelee = this.equip.equippedMelee;
					this.posingGrenade = null;
					break;
			}

			this.workItBaby();
		},

		selectEquippedItemForType: function () {
			switch (this.equip.selectedItemType) {
				case ItemType.Hat: this.equip.selectedItem = this.equip.equippedHat; break;
				case ItemType.Stamp: this.equip.selectedItem = this.equip.equippedStamp; break;
				case ItemType.Primary: this.equip.selectedItem = this.equip.equippedPrimary; break;
				case ItemType.Secondary: this.equip.selectedItem = this.equip.equippedSecondary; break;
				case ItemType.Grenade: this.equip.selectedItem = this.equip.equippedGrenade; break;
				case ItemType.Melee: this.equip.selectedItem = this.equip.equippedMelee; break;
			}
		},

		populateItemGridWithType: function (itemType) {
			this.equip.selectedItemType = itemType;
			var items = extern.getItemsOfType(itemType);
			this.populateItemGrid(items);
			
			this.equip.categoryLocKey = 'item_type_{0}{1}'.format(itemType, ((itemType === ItemType.Primary) ? '_' + this.classIdx : ''));
		},

		populateItemGridWithTagged: function (tag) {
			var items = extern.getTaggedItems(tag);
			this.populateItemGrid(items);
			this.equip.categoryLocKey = 'item_type_5';
		},

		populateItemGrid: function (items) {
			if(items.length > 100) {
				vueApp.showSpinner('please_wait');
			}
				if (this.equip.mode === vueData.equip.equipModes.inventory) {
					items = items.filter(i => extern.isItemOwned(i) || (i.is_available && i.unlock === "default"));
				} else {
					items = items.filter(i => i.is_available && !extern.isItemOwned(i) && (i.unlock === 'purchase' || (i.unlock === 'premium' && i.sku)));
				}
				this.equip.showingItems = items;

			setTimeout(() => {
				vueApp.hideSpinner();
			}, 20);
		},

		workItBaby: function () {
			extern.poseWithItem(ItemType.Hat, this.posingHat);
			extern.poseWithItem(ItemType.Stamp, this.posingStamp);
			extern.poseWithItem(this.posingWeapon.item_type_id, this.posingWeapon);
			if (this.posingGrenade) extern.poseWithItem(this.posingGrenade.item_type_id, this.posingGrenade);
			if (this.posingMelee) extern.poseWithItem(this.posingMelee.item_type_id, this.posingMelee);
		},

		onBackClick: function () {
			vueApp.showSpinner();
			extern.saveEquipment(() => {
				vueApp.hideSpinner();
				this.equip.showingWeaponType = ItemType.Primary;
				this.poseEquippedItems();
				vueApp.equipCalledInGame = false

				if (!extern.inGame) {
					vueApp.showTitleScreenAd();
					vueApp.switchToHomeUi();
				} else {
					extern.closeEquipInGame();
					vueApp.switchToGameUi();
					vueApp.showGameMenu();
					vueApp.showRespawnDisplayAd();
				}
				extern.renderItemClearQueue();
				this.removeSidebarSlide(false);
				BAWK.play('ui_popupclose');
			});
		},

		onItemTypeChanged: function (itemType) {
			this.switchItemType(itemType);
		},

		switchItemType: function (itemType) {
			if (itemType !== this.equip.selectedItemType) {
				if (itemType === ItemType.Primary || itemType === ItemType.Secondary || itemType == ItemType.Grenade || itemType == ItemType.Melee) {
					this.equip.showingWeaponType = itemType;
				}
				this.poseEquippedItems();
				this.populateItemGridWithType(itemType);
				if (this.equip.mode === this.equip.equipModes.inventory) {
					this.selectEquippedItemForType();
				} else {
					this.selectFirstItemInShop();
				}
			}
			if (!this.isInShop) {
				this.hideItemForSale();
				this.hideItemForSpecial();
			}
			// BAWK.play('ui_click');
		},

		onTaggedItemsClicked: function () {
			this.showTaggedItems(this.equip.specialItemsTag);
			this.selectFirstItemInShop();
			BAWK.play('ui_click');
		},

		showTaggedItems: function (tag) {
			this.equip.selectedItemType = 'tagged';

			if (this.equip.mode === this.equip.equipModes.inventory && !this.ownsTaggedItems(this.equip.specialItemsTag)) {
				this.equip.mode = this.equip.equipModes.shop;
			}
			
			this.populateItemGridWithTagged(tag);
		},

		showSelectedTagItems(tag) {
			this.equip.selectedItemType = 'tagged';
			if (this.equip.mode === this.equip.equipModes.inventory) {
				this.equip.mode = this.equip.equipModes.shop;
			}
			this.populateItemGridWithTagged(tag);
		},

		resetItemsOnSwitch() {
			if (this.posingMelee || this.posingGrenade) this.equip.showingWeaponType = null;
			this.equip.showingItems = [];
			this.posingMelee = null;
			this.posingGrenade = null;
			this.poseEquippedItems();
		},

		switchToInventory: function () {

			this.resetItemsOnSwitch();

			if (this.ui.showScreen === this.ui.screens.equip) {
				this.removeSidebarSlide(false);
			}

			if (this.equip.selectedItemType === 'tagged' && this.equip.mode === this.equip.equipModes.shop) {
				if (!this.ownsTaggedItems(this.equip.specialItemsTag)) {
					this.switchItemType(ItemType.Primary);
				}
			}

			this.equip.mode = this.equip.equipModes.inventory;
			this.hideItemForSale();
			this.hideItemForSpecial();
			this.poseEquippedItems();
			this.showItemsAfterEquipModeSwitch();
			this.selectEquippedItemForType();
			BAWK.play('ui_toggletab');
			// vueApp.histPushState({game: this.ui.screens.equip}, 'Shellshockers equipment inventory', '?equip=inventory');
		},

		ownsTaggedItems: function (tag) {
			return extern.getTaggedItems(tag).filter(i => {
					return extern.isItemOwned(i);
				}).length > 0;
		},

		selectFirstItemInShop: function () {
			if (this.isInShop && this.equip.showingItems.length > 0) {
				this.selectItem(this.equip.showingItems[0]);
			}
		},

		switchToShop: function () {
			if (!this.accountSettled) {
				return;
			}
			this.resetItemsOnSwitch();
			if (this.ui.showScreen === this.ui.screens.equip) {
				this.removeSidebarSlide(false);
			}
			this.equip.mode = this.equip.equipModes.shop;
			this.showItemsAfterEquipModeSwitch();
			this.selectFirstItemInShop();
			// vueApp.conditionalAnonWarningCall();
			// BAWK.play('ui_toggletab');
			// vueApp.histPushState({game: this.ui.screens.equip}, 'Shellshockers equipment shop', '?equip=shop');
		},

		showItemsAfterEquipModeSwitch: function () {
			if (this.equip.selectedItemType !== 'tagged') {
				this.populateItemGridWithType(this.equip.selectedItemType);
			} else {
				this.showTaggedItems(this.equip.specialItemsTag)
			}
		},

		onEquippedTypeSelected: function (itemType) {
			this.equip.selectedItemType = itemType;
			if (
				this.equip.selectedItemType === ItemType.Primary ||
				this.equip.selectedItemType === ItemType.Secondary ||
				this.equip.selectedItemType === ItemType.Grenade ||
				this.equip.selectedItemType === ItemType.Melee
			) {
				this.equip.showingWeaponType = itemType;
			}
			this.switchToInventory();
		},

		onChangedClass: function () {
			this.removeSidebarSlide();
			this.hideItemForSale();
			this.hideItemForSpecial();

			if (this.posingGrenade) {
				this.posingGrenade = null;
				this.onEquippedTypeSelected(ItemType.Primary);
			}

			if (this.equip.selectedItemType !== ItemType.Primary) {
				this.onEquippedTypeSelected(ItemType.Primary);
			}

			this.updateEquippedItems();
			this.poseEquippedItems();
			this.populateItemGridWithType(this.equip.selectedItemType);

			if (extern.inGame && this.ui.showScreen !== this.ui.screens.equip) {
				this.equip.showingWeaponType = ItemType.Primary;
				extern.closeEquipInGame();
			}

		},

		autoSelectItem: function (item) {
			if (extern.isItemOwned(item)) {
				this.switchToInventory();
			} else {
				this.switchToShop();
			}
			this.switchItemType(item.item_type_id);
			this.selectItem(item);
		},

		onItemSelected: function (item) {
			this.selectItem(item);
		},

		selectItem: function (item) {
			var selectingSame = hasValue(this.equip.selectedItem) && this.equip.selectedItem.id === item.id;
			var selectedId = selectingSame ? this.equip.selectedItem.id : null;
			var isWeapon = (item.item_type_id === ItemType.Primary || item.item_type_id === ItemType.Secondary);
			BAWK.play('ui_click');

			if (selectingSame) {
				this.removeSidebarSlide();
				if (this.isInShop) {
					// Revert to equipped weapon
					item = this.$options[this.equip.selectedItem.item_type_id];
				} else {
					// Take off hat or stamp
					if (!isWeapon) {
						item = null;
						extern.removeItemType(this.equip.selectedItem.item_type_id);
					}
				}
			}
			// Take off any items being tried on
			this.poseEquippedItems();
			this.equip.selectedItem = item;
			extern.tryEquipItem(item);
			this.updateEquippedItems();

			if (hasValue(item)) {
				this.poseWithItem(item);

				if (this.isInShop) {
					switch (item.unlock) {
						case "physical":
							console.log('purchasing physical item');
							
							if ( !selectingSame ) {
								this.offerItemForSpecial(item)
								this.hideItemForSale();
							} else {
								this.hideItemForSpecial();
							}
							// this.$refs.physicalUnlockPopup.toggle();
							break;
						case "purchase":
						case "premium":
							if (!selectingSame) {
								this.offerItemForSale(item);
								this.hideItemForSpecial();
							} else {
								this.hideItemForSale();
							}
						break;
					}
					this.equip.buyNowActive = true;
				}
			} else {
				this.poseEquippedItems();
				this.hideItemForSale();
				this.hideItemForSpecial();
				this.equip.buyNowActive = false;

			}
		},

		poseWithItem: function (item) {
			switch (item.item_type_id) {
				case ItemType.Hat: this.posingHat = item; break;
				case ItemType.Stamp: this.posingStamp = item; break;
				case ItemType.Grenade: this.posingGrenade = item; break;
				case ItemType.Melee: this.posingMelee = item; break;
				case ItemType.Primary:
				case ItemType.Secondary: this.posingWeapon = item; break;
			}

			this.workItBaby();
		},

		getButtonToggleClass: function (equipMode) {
			return (equipMode === this.equip.mode) ? 'btn_toggleon' : 'btn_toggleoff';
		},

		offerItemForSpecial: function(item) {
			return this.equip.physicalUnlockPopup.item = item;
		},

		hideItemForSpecial: function() {
			this.equip.physicalUnlockPopup.item = null;
		},

		offerItemForSale: function (item) {
			this.equip.buyingItem = item;
		},

		hideItemForSale: function () {
			this.equip.buyingItem = null;
			// this.equip.physicalUnlockPopup.item = null
		},

		onBuyItemClicked: function () {
			this.removeSidebarSlide();
			// If item is buying item show buyItemPopup or show physicalUnlockPopup
			// this.equip.buyingItem ? this.$refs.buyItemPopup.toggle() : this.$refs.physicalUnlockPopup.toggle();
			if (this.equip.buyingItem.unlock === 'premium') {
				if (!this.firebaseId || this.isAnonymous) {
					vueApp.denyAnonUser();
					return;
				}
			}
			this.equip.buyingItem ? this.$refs.buyItemPopup.toggle() : '';
			this.equip.buyingItem ? extern.renderItemToCanvas(this.equip.buyingItem, this.$refs.buyItemCanvas) : null;
			BAWK.play('ui_popupopen');
		},

		onBuyItemConfirm: function () {
			if (this.eggs === 0) {
				vueApp.needMoreEggsPopupCall();
				return;
			}
			if (this.equip.buyingItem.unlock === 'premium') {
				extern.buyProductForMoney(this.equip.buyingItem);
				return;
			} else {
				extern.api_buy(this.equip.buyingItem, this.boughtItemSuccess, this.boughtItemFailed);
			}
			BAWK.play('ui_playconfirm');
		},

		boughtItemSuccess: function () {
			this.equip.selectedItem = this.equip.buyingItem;
			ga('send', 'event', {
				eventCategory: this.googleAnalytics.cat.itemShop,
				eventAction: this.googleAnalytics.action.shopItemPopupBuy,
				eventLabel: this.equip.buyingItem.name,
				eventValue: this.equip.selectedItem.price
			});
			var itemType = this.equip.selectedItem.item_type_id;
			if (itemType === ItemType.Primary || itemType === ItemType.Secondary || itemType == ItemType.Grenade || itemType == ItemType.Melee) {
				this.equip.showingWeaponType = itemType;
			}
			this.hideItemForSale();
			this.setup(this.equip.selectedItemType);
			this.updateEquippedItems();
			this.poseEquippedItems();
			this.selectEquippedItemForType();
		},

		boughtItemFailed: function () {
			vueApp.showGenericPopup('p_buy_error_title', 'p_buy_error_content', 'ok');
			BAWK.play('ui_reset');
		},

		onRedeemClick: function () {
			this.$refs.redeemCodePopup.code = '';
			this.$refs.redeemCodePopup.toggle();
			// BAWK.play('ui_popupopen');
		},

		onRedeemCodeConfirm: function () {
			extern.api_redeem(this.equip.redeemCodePopup.code, this.redeemCodeSuccess, this.redeemCodeFailed);
			BAWK.play('ui_playconfirm');
		},

		redeemCodeSuccess: function (eggs, items) {
			this.populateItemGridWithType(this.equip.selectedItemType);
			

			this.giveStuffPopup.eggs = eggs;
			this.giveStuffPopup.items = items;
			vueApp.showGiveStuffPopup('p_give_stuff_title', eggs, items);

			let itemString = '';
			this.giveStuffPopup.items.forEach(item => itemString += item.name);

			ga('send', 'event', {
				eventCategory: this.googleAnalytics.cat.redeem,
				eventAction: this.googleAnalytics.action.redeemed,
				eventLabel: `${itemString ? itemString : ''} ${this.giveStuffPopup.eggs ? this.giveStuffPopup.eggs + 'eggs' : ''}`
			});
		},

		redeemCodeFailed: function () {
			vueApp.showGenericPopup('p_redeem_error_title', 'p_redeem_error_content', 'ok');
			BAWK.play('ui_reset');
		},

		onPhysicalUnlockConfirm: function () {
			window.open(this.equip.physicalUnlockPopup.item.item_data.physicalItemStoreURL, '_blank');
		},

		onColorChanged: function (colorIdx) {
			this.equip.colorIdx = colorIdx;
			extern.setShellColor(this.equip.colorIdx);
			BAWK.play('ui_onchange');
		},

		onSwitchToShopClicked: function () {
			this.switchToShop();
		},
		showColorMenu(e) {
			this.ui.showColors = e;
		},
		removeSidebarSlide(sound) {
			sound = sound ? sound : true;
			// if (sound) BAWK.play('ui_toggletab');
			this.equipSlideActive = false;
			document.getElementById('equip_panel_left').classList.remove('left-slide');
			document.getElementById('equip_panel_right').classList.remove('right-slide');
		},
		onEggStoreClick() {
			vueApp.showEggStorePopup();
		},
		onColorChangedClicked() {
			this.equip.colorSelectOpen = true;
			this.$refs.colorSelectPopup.show();
		},
		onColorChangedClosed() {
			this.$refs.colorSelectPopup.hide();
		},
		onColorSelectClosed() {
			this.equip.colorSelectOpen = false;
		},
	},

	computed: {
		isInShop: function () {
			return (this.equip.mode === this.equip.equipModes.shop);
		},

		inventoryCls() {
			return this.equip.mode === vueData.equip.equipModes.inventory ? 'in-inventory' : '';
		},
		uiFadeCls() {
			return this.equip.colorSelectOpen ? 'ui-fade' : '';
		},
		getGridClass: function () {
			return this.isInShop ? '' : 'equip_grid_short';
		},

		isEggStoreSaleItem() {
            return this.eggStoreItems.some( item => item['salePrice'] !== '');
		},
		
		isBuyingItemPrem() {
			if (!this.equip.buyingItem) {
				return;
			}
			return this.equip.buyingItem.unlock === 'premium';
		},
	},
	watch: {
		equipCalledInGame(val) {
			return val;
		}
	}
};

        <controls-ui :show="inGameUiActive" :vueData="vueData" :loc="loc" ref='controlsUi' :weapon-idx="mobileUi.weaponIdx"></controls-ui>

		<!-- Big Message Bar -->
		<div id="bigMessageContainer" style="display: none">
			<div id="bigMessageBar">
				<div id="bigMessage"></div>
				<div id="bigMessageCaption"></div>
			</div>
		</div>

        <!-- Weapon -->
        <div id="weaponBox">
            <div id="grenades">
                <img id="grenade3" class="grenade" src="img/ico_grenadeEmpty.png?v=1"/>
                <img id="grenade2" class="grenade" src="img/ico_grenadeEmpty.png?v=1"/>
                <img id="grenade1" class="grenade" src="img/ico_grenadeEmpty.png?v=1"/>
            </div>
            <h2 id="weaponName"></h2>
            <h2 id="ammo" class="shadow_grey"></h2>
        </div>

        <!-- Health -->
        <div id="healthContainer">
            <svg class="healthSvg">
                <circle id="healthBar" class="healthBar" cx="50%" cy="50%" r="2.15em" />
                <circle class="healthYolk" cx="50%" cy="50%" r="1.35em" />
            </svg>

            <div id="healthHp">100</div>
        </div>

        <!-- Hard Boiled -->
        <div id="hardBoiledContainer">
            <div id="hardBoiledShieldContainer">
                <img class="hardBoiledShield" src="img/hardBoiledEmpty.png">
                <img class="hardBoiledShield" id="hardBoiledShieldFill" src="img/hardBoiledFilled.png">
            </div>

            <div id="hardBoiledValue">100</div>
        </div>

        <!-- EggBreaker Shellstreak -->
        <div id="eggBreakerContainer" class="off">
            <img id="eggBreakerIcon" src="img/ico_eggBreaker.png" />
            <div id="eggBreakerTimer">15</div>
        </div>

        <!-- Spatula -->
        <img id="spatulaPlayer" src="img/spatulaIcon.png" />

        <!-- Grenade throw power -->
        <div id="grenadeThrowContainer">
            <div id="grenadeThrow"></div>
        </div>

        <!-- Kill -->
        <div id="killBox" class="shadow_grey">
            <!-- <h3>{{ loc.ui_game_youkilled }}</h3> -->
            <div v-html="killedMessage"></div>
            <!-- <h2 id="KILLED_NAME"></h2> -->
            <h3 id="KILL_STREAK"></h3>
        </div>

        <!-- Death -->
        <div id="deathBox">
            <!-- <h3>{{ killedByMessage }}</h3> -->
            <div v-html="killedByMessage"></div>
            <!-- <h2 id="KILLED_BY_NAME"></h2> -->
            <h3 id="respawnMessage"></h3>
        </div>

        <!-- Game messages -->
        <div id="gameMessage"></div>

        <!-- Chat -->
        <div id="chatOut" class="chat roundme_sm"></div>

        <input id="chatIn" style="visibility: hidden;" class="chat roundme_sm" maxlength=64 tabindex=-1 v-bind:placeholder="loc.ingame_press_tab_to_exit" onkeydown="extern.onChatKeyDown(event)"></input>

        <!-- Kill ticker -->
        <div id="killTicker" class="chat" style="visibility: hidden;"></div>

        <!-- Spectator controls -->
        <div id="spectate">
            {{ loc.ui_game_spectating }}
        </div>

        <div id="serverAndMapInfo" class="shadow_grey box_relative"></div>

		<!-- Ingame UI Stuff -->
		<div id="inGameUI">
			<div id="readouts" class="shadow_grey">
                {{ loc.ui_game_fps }}: <div id="FPS"></div><br>
                {{ loc.ui_game_ping }}: <div id="ping"></div>
			</div>
		</div>
		<div class="account_eggs roundme_sm">
			<!-- <button v-if="isAnonymous" type="image" src="img/attention_indicator.png" v-show="showCornerButtons" @click="onAnonWarningClick" class="ss_button btn_yolk bevel_yolk attention_btn" v-bind:title="loc['account_title_shop']"><i class="fas fa-exclamation"></i></button> -->
			<img src="img/ico_goldenEgg.png" class="egg_icon">
			<span class="egg_count shadow_blue2_micro">{{ eggs }}</span>
		</div>
        <!-- Popup: Mute/Boot Player -->
        <small-popup id="playerActionsPopup" ref="playerActionsPopup" @popup-cancel="onPlayerActionsCancel" @popup-closed="onPlayerActionsCancel" :hide-confirm="true">
            <template slot="header">{{ playerActionsPopup.playerName }}</template>
            <template slot="content">
                <p>{{ loc.ui_game_playeractions_header }}</p>
                <h4 class="ss_button btn_medium btn_yolk bevel_yolk" v-if="playerActionsPopup.isGameOwner" v-on:click="onBootClicked">{{ loc.ui_game_playeractions_boot }}</h4>
            </template>
            <template slot="cancel">{{ loc.cancel }}</template>
        </small-popup>

		<!-- Popup: Switch Team -->
		<small-popup id="switchTeamPopup" ref="switchTeamPopup" @popup-cancel="onSwitchTeamCancel" :overlay-close="false" @popup-closed="onSwitchTeamCancel" @popup-confirm="onSwitchTeamConfirm">
			<template slot="header">{{ loc.p_switch_team_title }}</template>
			<template slot="content">
                <h4 class="roundme_sm" :class="newTeamColorCss">{{ newTeamName }} <i class="fa fa-flag fa-1x"></i></h4>
				<p>{{ loc.p_switch_team_text }}</p>
			</template>
			<template slot="cancel">{{ loc.no }}</template>
			<template slot="confirm">{{ loc.yes }}</template>
		</small-popup>

		<!-- Popup: Share Link -->
		<small-popup id="shareLinkPopup" ref="shareLinkPopup" :popup-model="game.shareLinkPopup" @popup-confirm="onShareLinkConfirm" @popup-closed="onShareLinkClosed">
			<template slot="header">{{ loc.p_sharelink_title }}</template>
			<template slot="content">
				<p>{{ loc.p_sharelink_text }}</p>
				<p><input ref="shareLinkUrl" type="text" class="ss_field ss_margintop ss_marginbottom fullwidth" v-model="game.shareLinkPopup.url" @focus="$event.target.select()" readonly="readonly"></p>
			</template>
			<template slot="cancel">{{ loc.close }}</template>
			<template slot="confirm">{{ loc.p_sharelink_copylink }}</template>
		</small-popup>

        <!-- Popup: Leave Game Confirm -->
		<small-popup id="leaveGameConfirmPopup" ref="leaveGameConfirmPopup" class="leave-game-popup-container" :overlay-close="false" :hide-close="true" @popup-confirm="onLeaveGameConfirm" @popup-cancel="onLeaveGameCancel">
			<template slot="header">{{ loc.leave_game_title }}</template>
			<template slot="content">
				<p>{{ loc.leave_game_text }}</p>
			</template>
			<template slot="cancel" class="we-a-button">{{ loc.no }}</template>
			<template slot="confirm">{{ loc.yes }}</template>
		</small-popup>

        <div class="player__container">
			<div id="player__collapse-container" class="player__collapse-container display-grid grid-column-2-eq">
				<button class="collapse-pl-btn btn_green btn_sm btn_green bevel_green player-count-ui-black" @click="onClickCollapsePlayerList"><i :class="[settingsUi.togglers.misc[collapseIdx].value ? 'fa-chevron-down' : 'fa-chevron-up']" class="fas fa-chevron-down"></i></button>
				<div class="player-counts display-grid justify-items-end grid-column-2-eq">
					<div class="player-count playerSlot-them-blue"><i class="fas fa-user"></i> <span></span></div> <span class="player-count playerSlot-them-red"><i class="fas fa-user"></i> <span></span></span>
				</div>
			</div>
            <!-- Player List -->
                <div id="playerSlot" class="playerSlot" style="display: none">
                    <div>
                        <span></span> <!-- Name -->
                        <span></span> <!-- Score -->
                    </div>
                    <div style="display: block;"></div> <!-- Icons -->
                </div>
                <div id="playerList"></div>
            </div>

        <div id="inGameScaler" class="box_relative">

                    <template slot="content">
                        <div class="box_blue2 roundme_sm">
                            <div id="pausePopupInnards" class="roundme_sm f_row">

                                    <div v-if="isPoki && pokiRewardReady" class="poki-reward-container">
                                        <button class="ss_button btn_blue bevel_blue btn_reward pure-wiggle" @click="earnInGameReward"><img src="img/ico_goldenEgg.png" class="egg_icon">Watch Video for 100 Golden Eggs!</button>

											</div>
										</div>

									</div>

                                    <div id="btn_horizontal" class="pause-popup--btn-group ss_margintop_xl ss_marginbottom_xl">
                                        <header class="weapon-select weapon-select--title pause-bg roundme_sm">
                                            <h1>{{loc.p_weapon_title}}</h1>
                                        </header>
                                        <div class="weapon-select-bg pause-bg roundme_sm">

                                        <!-- .pause-bg -->
                                    </div>

                                            <div v-if="isTeamGame" class="switch-teams-btn">
                                                <button @click="onSwitchTeamClicked" class="ss_button btn_big btn_wfull" :disabled="!delayTheCracking" :class="teamColorCss"><i class="fa fa-flag fa-1x"></i> <span v-html="teamName"></span></button>
                                            </div>
                                            <!-- <button @click="onHomeClicked" class="ss_button btn_blue bevel_blue"><i class="fa fa-home"></i> {{ loc.p_pause_home }}</button> -->
                                            <button @click="onEquipClicked()" class="ss_button btn_big btn_wfull btn_blue bevel_blue"><i class="fas fa-star fa-1x"></i> {{ loc.p_pause_equipment }}</button>
                                            <!-- <button v-if="!delayTheCracking && !isRespawning" class="ss_button btn_big btn_wfull btn_red bevel_red btn_sm" disabled="disabled"><i class="fas fa-eye fa-1x"></i> {{ loc.ui_game_get_ready }}</button> -->
                                            <!-- <button :disabled="isRespawning || !delayTheCracking" @click="onSpectateClicked" class="ss_button btn_big btn_wfull btn_blue bevel_blue btn_sm" ><i class="fas fa-eye"></i> {{ loc.p_pause_spectate }}</button> -->
											<button class="ss_button btn_big btn_wfull btn_blue bevel_blue" @click="onClickCustomControls"><i class="fas" :class="ui.gameScreen.icons.customControls"></i> {{ loc.p_settings_mobile_custom_controls }}</button>
                                            <button class="ss_button btn_big btn_wfull btn_blue bevel_blue" @click="onClickAutoFire"><i class="fas" :class="ui.gameScreen.icons.autofire"></i> {{ loc.p_settings_mobile_autofire }}</button>
                                        </div>
                                        <div class="pause-popup--btn-group f-grow-full">
                                            <button v-if="!delayTheCracking && !isRespawning" class="btn_big btn_wfull ss_button btn_red bevel_red" disabled="disabled">{{ loc.ui_game_get_ready }}</button>
                                            <button v-if="delayTheCracking" class="btn_big btn_wfull ss_button btn_red bevel_red" v-show="isRespawning" :disabled="isRespawning">{{ game.respawnTime }}</button>
                                            <button v-if="delayTheCracking" v-show="!isRespawning" @click="onPlayClicked()" class="btn-respawn btn_big btn_wfull ss_button btn_yolk bevel_yolk" :disabled="isRespawning"><i class="fa fa-play fa-1x"></i> {{ loc.p_pause_play }}</span></button>
                                            <!-- .pause-popup--btn-group -->
                                        </div>
                                        <music-widget ref="gameScreenMusic" :loc="loc" :settings-ui="settingsUi" :settings="true" :volumeSlider="false" :show="isPaused && showMusicWidget"></music-widget>
                                    </div>
                                    <!-- #pauseButtons -->
                                    <!-- .pause-popup--btn-group -->
                                </div>
                                <!-- #popupTipDay -->
                            </div>
                            <!-- #pausePopupInnards -->
                        </div>
                    </template>
                </large-popup>

                    { id: 'EGGK47', name: 'weapon_soldier_title', img: 'img/weapon-icons/ico_weapon_EggK47.svg' },
                    { id: 'DOZENGAUGE', name: 'weapon_scrambler_title', img: 'img/weapon-icons/ico_weapon_Scrambler.svg' },
                    { id: 'CSG1', name: 'weapon_ranger_title', img: 'img/weapon-icons/ico_weapon_FreeRanger.svg'},
                    { id: 'RPEGG', name: 'weapon_eggsploder_title', img: 'img/weapon-icons/ico_weapon_RPEGG.svg' },
                    { id: 'SMG', name: 'weapon_whipper_title', img: 'img/weapon-icons/ico_weapon_Whipper.svg' },
                    { id: 'M24', name: 'weapon_crackshot_title', img: 'img/weapon-icons/ico_weapon_Crackshot.svg' },
                    { id: 'AUG', name: 'weapon_trihard_title', img: 'img/weapon-icons/ico_weapon_TriHard.svg' },
                    { id: 'CLUCK9MM', name: 'weapon_cluck_9mm', img: 'img/inventory-icons/ico_weaponSecondary.svg' },
                ]
            };
        },
        computed: {
            items: function() {
                var res = [];
                for (var i = 0; i < this.weapons.length; i++) {
                    res.push({
                    id: this.weapons[i].id,
                    name: this.weapons[i].name,
                    img: this.weapons[i].img,
                    value: this.values[this.weapons[i].id],
                    });
                }

                return res;
            }
        },
        methods: {
            onAutofireToggled: function(id, value) {
                this.values[id] = value;
                // Need to assign to trigger update
                // deep watch doesn't work?
                this.values = this.values;
                ga('send', 'event', 'settings-mobile', 'auto_fire_toggle', `${id}-${value}`);
            },
        }
    };
</script>


<script>
var comp_game_screen = {
    template: '#game-screen-template',
    components: {
        'account-panel': comp_account_panel,
        // 'event-panel': comp_events,
        'weapon-select-panel': comp_weapon_select_panel,
        // 'music-widget': comp_music_widget,
        // 'event-panel': comp_events,
        'controls-ui': compControlUi
    },
    props: ['kname', 'kdname'],
	data: function () {
		return vueData;
    },
    created: function () {
        // this.isPoki = ! extern.pokiInitialized() ? extern.pokiInitialized() : extern.isPokiSDK();
        this.isPoki  = false;
    },
    methods: {
        placeBannerAdTagForGame: function (tagEl) {
            this.$refs.pauseAdPlacement.appendChild(tagEl);
        },

        showGameMenu: function () {
            // this.game.tipIdx = this.loc.tip_ofthe_day
            // ? Math.randomInt(0, this.loc.tip_ofthe_day.length)
            // : 0;
            this.game.gameType = extern.gameType;
            this.$refs.leaveGameConfirmPopup.hide();
            this.$refs.pausePopup.show();
            this.isPaused = true;
            setTimeout(() => vueApp.disableRespawnButton(false), 500);
            vueData.ui.showCornerButtons = true;
			vueApp.gameUiAddClassForNoScroll();
			extern.chicknWinnerOnPause();
            addEventListener('gamepadbuttondown', this.onControllerButton);
        },

        delayGameMenuPlayButtons() {
            setTimeout(() => {
                this.delayTheCracking = true;
            }, 3000);
        },

        hideGameMenu: function () {
            if (!extern.inGame)  {
                return;
            }

            this.$refs.pausePopup.hide();
            // this.$refs.respawnDisplayAd.hide();

            vueApp.gameUiAddClassForNoScroll();
            removeEventListener('gamepadbuttondown', this.onControllerButton);
        },

        onHomeClicked: function () {
            if (!this.isPaused) {
                extern.removePlayerFromPlay();
            }
            this.hideGameMenu();
            this.$refs.leaveGameConfirmPopup.show();
            BAWK.play('ui_click');
        },

        onLeaveGameConfirm: function () {
            vueApp.game.popupOpenOnPause = true;
            this.leaveGame();
            this.delayTheCracking = false;
        },

        onLeaveGameCancel: function () {
            this.showGameMenu();
        },

        leaveGame: function () {
            var message = {"type":"refresh"}
            if (window.webkit && window.webkit.messageHandlers) {
                vueApp.showSpinner();
                window.webkit.messageHandlers.observe.postMessage(message);
            } else if (typeof Android !== 'undefined') {
                vueApp.showSpinner();
                Android.Refresh();
                return;
            }

            // clientGame.js manipulates chickenBadge element directly to hide/show it
            vueApp.disablePlayButton(false);
            this.$refs.chickenBadge.style.display = 'none';
            vueApp.showSpinner();
            document.body.style.overflow = 'visible';
            window.scrollY = 0;
            this.hidePopupsIfGameCloses();
            extern.leaveGame(this.afterLeftGame);
            vueData.ui.showCornerButtons = true;
            // OneSignal elements are not part of the Vue app
            var oneSignalBell = document.getElementById('onesignal-bell-container');
            if (oneSignalBell) {
                oneSignalBell.style.display = 'none';
            }
        },

        hidePopupsIfGameCloses: function() {
            const gamePopups = vueApp.$refs.gameScreen.$children;
            if (Array.isArray(gamePopups)) {
                gamePopups.forEach( gamePopup => {;
                    if ( gamePopup.isShowing === true && gamePopup.$el.id !== 'pausePopup' ) {
                        gamePopup.close();
                        console.log(`Closing ${gamePopup.$el.id}`);
                    }
                });
            }
        },

        afterLeftGame: function () {
            vueApp.hideSpinner();
            vueApp.showTitleScreenAd();
		    vueApp.switchToHomeUi();
        },

        onHelpClicked: function () {
            this.hideGameMenu();
            vueApp.showHelpPopup();
            BAWK.play('ui_popupopen');
        },

        onShareLinkClicked: function () {
            extern.inviteFriends();
            BAWK.play('ui_popupopen');
        },

        onSettingsClicked: function () {
            this.hideGameMenu();
            vueApp.showSettingsPopup();
            BAWK.play('ui_popupopen');
        },

        onShareLinkConfirm: function () {
            extern.copyFriendCode(this.$refs.shareLinkUrl);
        },

        onShareLinkClosed: function () {
            this.showGameMenu();
        },

        onEquipClicked: function () {
            this.hideGameMenu();
            vueApp.equipCalledInGame = true;
            extern.openEquipInGame();
            vueApp.switchToEquipUi();
            BAWK.play('ui_equip');
        },

        onSwitchTeamClicked: function () {
            if (!this.delayTheCracking) {
                console.log('Delayed');
                return;
            }
            this.hideGameMenu();
            BAWK.play('ui_popupopen');
            this.$refs.switchTeamPopup.show();
        },

        onSwitchTeamCancel: function () {
            this.showGameMenu();
        },

        onSwitchTeamConfirm: function () {
            extern.switchTeam();
        },

        onControllerButton: function (e) {
            switch (e.detail) {
                case '9':
                    if (document.hasFocus() && !this.isRespawning && this.delayTheCracking) {
                        this.onPlayClicked();
                    }
                    break;

                case '4':
                case '6':
                case '14':
                    vueData.classIdx = Math.max(0, vueData.classIdx - 1);
                    this.$refs.weaponSelect.selectClass(vueData.classIdx);
                    break;

                case '5':
                case '7':
                case '15':
                    vueData.classIdx = Math.min(5, vueData.classIdx + 1);
                    this.$refs.weaponSelect.selectClass(vueData.classIdx);
                    break;
            }
        },

        onPlayClicked: function () {
            vueApp.disableRespawnButton(true);
            vueData.ui.showCornerButtons = false;
            extern.respawn();
            this.isPaused = false;
            BAWK.play('ui_playconfirm');
        },

        onSpectateClicked: function () {
            if (this.isRespawning || !this.delayTheCracking) {
                return;
            }

            this.hideGameMenu();
            vueData.ui.showCornerButtons = false;
            extern.enterSpectatorMode();
            vueApp.hideRespawnDisplayAd();
            BAWK.play('ui_playconfirm');
        },

        showPlayerActionsPopup: function () {
            this.hideGameMenu();
            extern.removePlayerFromPlay();
            this.$refs.playerActionsPopup.show();
        },

        onPlayerActionsCancel: function () {
            extern.showPlayerAction = false;
            this.showGameMenu();
        },

        onMuteClicked: function () {
            this.$refs.playerActionsPopup.hide();
            this.playerActionsPopup.muteFunc();
        },

        onBootClicked: function () {
            this.$refs.playerActionsPopup.hide();
            this.playerActionsPopup.bootFunc();
        },

        resizeBannerAdTagForGame: function() {
            const pauseAdPlacement = document.getElementById('pauseAdPlacement');
            const rect = document.getElementById('pausePopup').getBoundingClientRect();

            pauseAdPlacement.style.top = (rect.height).toString() + 'px';
        },
        earnInGameReward() {
            this.hideGameMenu();
            vueApp.setDarkOverlay(true);
            this.pokiRewardReady = false;
             this.isPokiNewRewardTimer = false;
            extern.api_inGameReward(this.inGameRewardSuccessCallback, this.inGameRewardFailedCallback, this.rewardReachedDailyLimits);
            extern.setVolume(0);
        },
        inGameRewardSuccessCallback() {
            extern.pokiRewardedBreak(this.inGameRewardIsGranted, this.inGameRewardFailedCallback);
        },
        inGameRewardIsGranted(rewardValue) {
            console.log('inGameRewardSuccessCallback');
            this.isPokiNewRewardTimer = true;
            vueApp.showGiveStuffPopup('reward_title', rewardValue, '');
            ga('send', 'event', 'Poki', 'Rewarded Video', 'Reward Success', this.pokiRewNum);
            this.pokiRewNum ++;
        },
        inGameRewardFailedCallback() {
            vueApp.showGenericPopup('p_redeem_error_title', 'in_game_reward_try_again', 'ok');
            this.isPokiNewRewardTimer = false;
            ga('send', 'event', 'Poki', 'Rewarded Video', 'Failed');
        },
        rewardReachedDailyLimits() {
            vueApp.showGenericPopup('in_game_reward_title', 'in_game_reward_try_again', 'ok');
            this.isPokiNewRewardTimer = false;
            localStore.setItem('inGameRewardLimitDate',  Date.now());
            extern.setVolume();
            ga('send', 'event', 'Poki', 'Rewarded Video', 'Reached Daily Limit');
        },

        pokiTimers(value, milliseconds) {
            let pokiSetTimer;

            if (value === false) {
                clearTimeout(pokiSetTimer);
                console.log('cancelTimer');
                return;
            }
            pokiSetTimer = setTimeout(() => this.pokiRewardReady = true, milliseconds);
        },

        pauseWeaponSelect(idx) {
            vueApp.$refs.equipScreen.onChangedClass(idx);
        },
        songHasChanged() {
            setTimeout(() => this.songChanged = false , 2000);
        },
		onClickCustomControls() {
			BAWK.play('ui_popupopen');
			vueApp.showUiCustomPopup();
		},
        onClickAutoFire() {
            BAWK.play('ui_popupopen');
            vueApp.showAutofirePopup();
        },
		playIncentivizedAd(e) {
			if (!this.chicknWinnerReady || this.hasChwPlayClicked || this.isChicknWinnerError) {
				e.preventDefault();
				return;
			}
			vueApp.disableRespawnButton(true);
			this.hasChwPlayClicked = true;
			vueApp.loadNuggetVideo();
			vueApp.chicknWinnerNotReady();
			ga('send', 'event', 'Chickn Winner', 'Free eggs btn', 'click-in-game');

		},
		onClickCollapsePlayerList() {
			// this.settingsUi.togglers.misc[6].value;
			if (this.settingsUi.togglers.misc[this.collapseIdx].value) {
				this.settingsUi.togglers.misc[this.collapseIdx].value = false
			} else {
				this.settingsUi.togglers.misc[this.collapseIdx].value = true
			}
			extern.applyUiSettings(this.settingsUi, this.settingsUi);
		}
    },

    computed: {
        isRespawning: function () {
            return this.game.respawnTime > 0;
        },

        isTeamGame: function () {
            // Would be better to use the same enum as the client game code
            return this.game.gameType !== 0;
        },

        teamColorCss: function () {
            return this.game.team === this.ui.team.blue ? 'blueTeam btn_red bevel_red' : 'redTeam btn_blue bevel_blue';
        },

        teamName: function () {
            return this.game.team === this.ui.team.blue ? this.loc.p_pause_joinred : this.loc.p_pause_joinblue;
        },

        newTeamColorCss: function () {
            return this.game.team === this.ui.team.blue ? 'redTeam btn_red' : 'blueTeam btn_blue';
        },

        newTeamName: function () {
            return this.game.team === this.ui.team.blue ? this.loc.team_red : this.loc.team_blue;
        },

        muteButtonLabel: function () {
            return this.playerActionsPopup.muted ? this.loc.ui_game_playeractions_unmute : this.loc.ui_game_playeractions_mute;
        },
        showIngameWidget() {
            if (!this.isPaused && this.songChanged) {
                this.songHasChanged();
                return true;
            }
            return false;
        },
        showMusicWidget() {
            return this.ui.showScreen === 2;
        },
		isEggStoreSaleItem() {
            return this.eggStoreItems.some( item => item['salePrice'] !== '' && this.ui.showCornerButtons);
        },
        upgradeBadgeUrl() {
            return this.isSubscriber ? 'img/vip-club/vip-club-popup-emblem.png' : 'img/ico_chickenBadge.png';
        },
		progressMsg() {
			if (this.isChicknWinnerError) {
				return this.loc.chw_error_text;
			}
			if (this.chicknWinnerDailyLimitReached && this.chicknWinnerCounter > 0) {
				return this.loc.chw_daily_limit_msg;
			}
			if (this.chicknWinnerReady) {
				if (this.chicknWinnerCounter === 0) {
					return this.loc.chw_ready_msg;
				} else {
					return this.loc.chw_cooldown_msg;
				}
			} else {
				return this.loc.chw_free_eggs_coming;
			}
		},
		progressBarWrapClass() {
			if (this.isChicknWinnerError) {
				return 'chw-progress-bar-wrap-error';
			}

			if (this.chicknWinnerReady) {
				return 'chw-progress-bar-wrap-complete';
			}
		},
		playAdText() {
			if (this.chicknWinnerReady && this.chicknWinnerCounter === 0) {
				return this.loc.chw_btn_free_reward;
			} else {
				return this.loc.chw_btn_watch_ad;
			}
		},
		chwShowCountdown() {
			if (this.chicknWinnerDailyLimitReached || this.isChicknWinnerError) {
				return 'hideme';
			} else {
				if (this.chicknWinnerReady) {
					return 'hideme';
				} else {
					return 'display-inline';
				}
			}
		},
		chwChickSrc() {
			if (this.chicknWinnerDailyLimitReached || this.isChicknWinnerError) {
				return 'img/chicken-nugget/chickLoop_daily_limit.svg';
			} else {
				if (!this.chicknWinnerReady) {
					return 'img/chicken-nugget/chickLoop_sleep.svg';
				} else {
					return 'img/chicken-nugget/chickLoop_speak.svg';
				}
			}
		},
		collapseIdx() {
			return this.settingsUi.togglers.misc.findIndex(el => el.id == 'miniPlayerList')
		}
    },

    watch: {
        isPokiGameLoad(value) {
            this.pokiTimers(value, this.videoRewardTimers.initial);
            // this.pokiTimers(value, 300);
        },
        isPokiNewRewardTimer(value) {
            this.pokiTimers(value, this.videoRewardTimers.primary);
            // this.pokiTimers(value, 300);
        },
        kname(val) {
            this.killedByMessage = this.loc['ui_game_killedby'].format(val);
        },
        kdname(val) {
            this.killedMessage = this.loc['ui_game_youkilled'].format(val);
        }
    }

};
</script>

<script>
    const comp_sub_item = {
        template: '#comp-sub-item',
        props: ['loc', 'item', 'upgradeName', 'isUpgraded', 'isSubscriber'],
        data() {
            return {
                isCurrentSub: false,
                hasSub: false,
                hasUpgrade: false,
                locName: '',
				itemClass: ''
            };
        },
        methods: {
            subClick() {

                if (this.$parent.$el.id === 'shell-subscriptions') {
                    this.$parent.$parent.hide();
                } else {
                    this.$parent.hide();
                }

                BAWK.play('ui_click');

                if (this.hasSub) {
                    extern.buyProductForMoney();
                } else {
                    extern.buyProductForMoney(this.item, true);
                    ga('send', 'event', 'subscriptions', 'click', this.locName);
                }
            }
        },
        computed: {
            nameLowerCaseHyphens() {
                this.locName =  this.item.name.replace(' ', '-').toLowerCase().replace(' ', '-');
				switch (this.locName) {
					case '1-month-membership':
						this.itemClass = 'one-month-membership';
						break;
					case '3-month-membership':
						this.itemClass = 'three-month-membership';
						break;
					case '12-month-membership':
						this.itemClass = 'twelve-month-membership'
						break;
					default:
						break;
				}
				return this.itemClass;
            },
            name() {
                return `s-${this.locName}-title`;
            },
            img() {
                return `img/vip-club/mobile/vip-club-popup-item-${this.locName}-bg.png`;
            },
            priceTag() {
                let price = this.item.salePrice ? this.item.salePrice : this.item.price,
                    priceWcents = `${(price / 100).toFixed(2)}`,
                    thePrice = priceWcents.split('.');
                return `$${thePrice[0]}<span class="price-tag--cents">.${thePrice[1]}</span>`;
            },
            buyBtnText() {
                if (this.isCurrentSub && this.hasUpgrade) {
                    return 's-btn-txt-change';
                }
                return 's-btn-txt-subscribe';
            },
            isActive() {
                if (this.isCurrentSub && this.hasUpgrade) {
                    return true
                } else if (this.hasSub && this.hasUpgrade) {
                    return false
                } else {
                    return true
                };
            },
            flagText() {
                if (this.isCurrentSub && this.hasUpgrade) return 'p_egg_shop_purchased';
                return this.item.flagText;
            }
        },
        watch: {
            isUpgraded(val) {
                this.hasUpgrade = val;
                this.hasSub = this.isSubscriber && this.hasUpgrade;
                this.isCurrentSub = this.upgradeName === this.item.name && this.hasUpgrade;
            }
        }
    };
</script>

        onManageClick() {
            if (this.$parent.$el.id === 'shell-subscriptions') {
                this.$parent.$parent.hide();
            } else {
                this.$parent.hide();
            }
            if (window.webkit && window.webkit.messageHandlers) {
                    var message = {"type":"manage"}
                    window.webkit.messageHandlers.observe.postMessage(message);
                    return;
            } else {
                extern.buyProductForMoney();
            }
        },
        openVipPopup() {
            if (this.$parent.$el.id === 'shell-subscriptions') {
                this.$parent.$parent.hide();
            } else {
                this.$parent.hide();
            }
            BAWK.play('ui_click');
            vueApp.showVipPopup();
        },
		openTerms() {
			if (window.webkit && window.webkit.messageHandlers) {
				var message = {"type":"openTerms"}
				window.webkit.messageHandlers.observe.postMessage(message);
			}
		},
		openPrivacy() {
			if (window.webkit && window.webkit.messageHandlers) {
				var message = {"type":"openPrivacy"}
				window.webkit.messageHandlers.observe.postMessage(message);
			}
		}
    },
    computed: {
        hasPlan() {
            return this.isSubscriber && this.isUpgraded;
        },
        expireDate() {
            if (this.hasPlan) {
                return new Date(extern.account.upgradeExpiryDate).toUTCString();
            }
            return;
        },
        planName() {
            if (this.hasPlan) {
                return 's-' + this.upgradeName.replace(' ', '-').toLowerCase().replace(' ', '-') + '-title';
            }
            return;
        },
        manageInfo() {
            return this.loc.sManageInfo;
        }
    }
};

            showRatePopup: function() {
                var raw = localStore.getItem('localLoadOut');
                if (!raw) {
                    // No data yet, player probaby not ready for rating yet
                    return;
                }
                var data = JSON.parse(raw);
                if (data.kills < 50) {
                    // Wait until the player has 50 kills
                    return;
                }

                var hasReviewed = localStore.getItem('hasReviewed');
                if (hasReviewed) {
                    // If the user already clicked an egg, we won't bother them again
                    // We don't know if the user actually rated the app in the native dialog
                    // but we'll just have to hope they did.
                    return;
                }

                var lastPrompt = parseInt(localStore.getItem('lastReviewPrompt'));
                if (lastPrompt) {
                    var elapsed = Date.now() - lastPrompt;
                    if (elapsed < 48 * 60 * 60 * 1000) {
                        // Do not spam the player with review prompts, wait for 2 days in-between
                        return;
                    }
                }

                this.$refs.ratePopup.show();

                localStore.setItem('lastReviewPrompt', Date.now().toString());

            uiInit() {
                // Initialize with the default layout
                this.mobileUi.uiCurrentLayout = [];
                for (const type of this.mobileUi.uiLayoutDefault) {
                    this.mobileUi.uiCurrentLayout.push(Object.assign({}, type));
                }

                // Setup ui el, objects and listeners
                for (const type of this.mobileUi.uiCurrentLayout) {
                    type.el = document.getElementById(type.control);
                    this.setUiElPos(type.el, type.x, type.y, type.scale);
                }

                // Load the stored layout, if any
                const storedLayout = getStoredObject(this.mobileUi.storedObj);
                if (storedLayout) {
                    this.uiLoadLayout(storedLayout);
                    this.customUiDefaultChanged = true;
                }
            },

            uiSetupListeners() {
                this.mobileUi.dragParent = document.getElementById('uiCustomPopup');
                
                for (const type of this.mobileUi.uiCurrentLayout) {
                    this.mobileAddEventListeners(type.el, 'pointerdown', this.uiElTouchStart, true);
                    this.mobileAddEventListeners(type.el, 'pointermove', this.uiElTouchMove, true);
                    this.mobileAddEventListeners(type.el, 'pointercancel', this.uiTouchCancel, true);
                    this.mobileAddEventListeners(type.el, 'pointerup', this.uiElTouchEnd, true);
                }

                this.addUiLayoutPinchListener(this.mobileUi.dragParent);
            },

            uiLoadLayout(layout) {
                for (const type of layout) {
                    const current = this.mobileUi.uiCurrentLayout.find((t) => t.control === type.control);
                    current.x = type.x;
                    current.y = type.y;
                    current.scale = type.scale;

                    this.setUiElPos(current.el, current.x, current.y, current.scale);
                }
            },

            hideUiCustomPopup() {
                if (this.customUiChanged) {
                    BAWK.play('ui_chicken');
                    this.mobileUi.confirmSave = true;
                    return;
                }
                BAWK.play('ui_popupclose');
                this.removeUiCustomListeners();
                this.disableUiCustom();
                this.onSharedPopupClosed();
            },

            addUiLayoutPinchListener(el) {
                this.pinchEvCache = [];
                this.pinchMaxCount = 0;
                this.pinchPrevDiff = -1;

                el.addEventListener('pointerdown', this.layoutPinchPointerDownHandler, false);
                el.addEventListener('pointermove', this.layoutPinchPointerMoveHandler, false);
                el.addEventListener('pointerup', this.layoutPinchPointerUpHandler, false);
                el.addEventListener('pointercancel', this.layoutPinchPointerUpHandler, false);
                el.addEventListener('pointerout', this.layoutPinchPointerUpHandler, false);
                el.addEventListener('pointerleave', this.layoutPinchPointerUpHandler, false);
            },

            removeUiLayoutPinchListener(el) {
                el.removeEventListener('pointerdown', this.layoutPinchPointerDownHandler);
                el.removeEventListener('pointermove', this.layoutPinchPointerMoveHandler);
                el.removeEventListener('pointerup', this.layoutPinchPointerUpHandler);
                el.removeEventListener('pointercancel', this.layoutPinchPointerUpHandler);
                el.removeEventListener('pointerout', this.layoutPinchPointerUpHandler);
                el.removeEventListener('pointerleave', this.layoutPinchPointerUpHandler);
            },

            layoutPinchPointerDownHandler(ev) {
                this.pinchEvCache.push(ev);
                this.pinchMaxCount++;
            },

            layoutPinchPointerMoveHandler(ev) {
                for (let i = 0; i < this.pinchEvCache.length; i++) {
                    if (ev.pointerId === this.pinchEvCache[i].pointerId) {
                        this.pinchEvCache[i] = ev;
                        break;
                    }
                }

                if (this.pinchEvCache.length === 2) {
                    const dx = this.pinchEvCache[0].clientX - this.pinchEvCache[1].clientX;
                    const dy = this.pinchEvCache[0].clientY - this.pinchEvCache[1].clientY;
                    const curDiff = Math.sqrt(dx * dx + dy * dy);

                    if (this.pinchPrevDiff > 0) {
                        this.layoutPinchOnScale(curDiff - this.pinchPrevDiff);
                    }

                    this.pinchPrevDiff = curDiff;
                }
            },

            layoutPinchOnScale(diff) {
                const obj = this.mobileUi.uiCurrentLayout[this.mobileUi.lastDragIdx];
                if (!obj) {
                    return;
                }

                const el = obj.el;
                let objRect = el.getBoundingClientRect();

                const currentScale = obj.scale;
                const currentSize = objRect.width;
                const newScale = Math.min(3, Math.max(0.5, (currentScale * (currentSize + diff)) / currentSize));

                obj.scale = newScale;
                el.style.transform = 'scale(' + newScale + ')';

                this.customUiDefaultChanged = true;
            },

            layoutPinchPointerUpHandler(ev) {

                if (this.pinchMaxCount === 1 && ev.target === this.mobileUi.dragParent) {
                    const type = this.mobileUi.uiCurrentLayout[this.mobileUi.lastDragIdx];
                    if (type) {
                        type.el.classList.remove('selected');
                        this.mobileUi.lastDragIdx = null;
                    }
                }

                for (let i = 0; i < this.pinchEvCache.length; i++) {
                    if (this.pinchEvCache[i].pointerId === ev.pointerId) {
                        this.pinchEvCache.splice(i, 1);
                        break;
                    }
                }

                if (this.pinchEvCache.length < 2) {
                    this.pinchPrevDiff = -1;
                }

                if (this.pinchEvCache.length === 0) {
                    this.pinchMaxCount = 0;
                }
            },

            mobileAddEventListeners(node, event, handler, capture = false) {
                if (!(event in this.mobileControlUiListeners)) {
                    this.mobileControlUiListeners[event] = []
                }

                this.mobileControlUiListeners[event].push({ node: node, handler: handler, capture: capture });
                 node.addEventListener(event, handler, capture);
            },

            removeAllListeners(targetNode, event) {
                // remove listeners from the matching nodes
                this.mobileControlUiListeners[event]
                    .filter(({ node }) => node === targetNode)
                    .forEach(({ node, handler, capture }) => node.removeEventListener(event, handler, capture))

                // update this.mobileControlUiListeners global
                this.mobileControlUiListeners[event] = this.mobileControlUiListeners[event].filter(
                    ({ node }) => node !== targetNode,
                )
            },

            removeUiCustomListeners() {
                this.mobileUi.uiCurrentLayout.forEach(type => {
                    this.removeAllListeners(type.el, 'pointerdown');
                    this.removeAllListeners(type.el, 'pointermove');
                    this.removeAllListeners(type.el, 'pointercancel');
                    this.removeAllListeners(type.el, 'pointerup');
                });

                this.removeUiLayoutPinchListener(this.mobileUi.dragParent);
            },

            setUiElPos(el, xPos, yPos, scale) {
                if (typeof xPos === 'string') {
                    if (xPos.startsWith('-')) {
                        el.style.right = xPos.substring(1);
                        el.style.left = '';
                    } else {
                        el.style.left = xPos;
                        el.style.right = '';
                    }
                } else {
                    el.style.left = xPos + 'px';
                    el.style.right = '';
                }

                if (typeof yPos === 'string') {
                    if (yPos.startsWith('-')) {
                        el.style.bottom = yPos.substring(1);
                        el.style.top = '';
                    } else {
                        el.style.top = yPos;
                        el.style.bottom = '';
                    }
                } else {
                    el.style.top = yPos + 'px';
                    el.style.bottom = '';
                }

                el.style.transform = 'scale(' + scale + ')';
                el.style.transformOrigin = 'center center';
            },

            uiElTouchStart(e) {
                let id = e.target.id || e.target.parentElement.id || e.target.nearestViewportElement.id || e.target.farthestViewportElement.id;
                if (id) {
                    e.preventDefault();
                    if (id === 'dpad-handle') {
                        id = 'dpad-wrapper';
                    }
                    const idx = this.mobileUi.uiCurrentLayout.findIndex(obj => obj.control === id);
                    this.mobileUi.dragIdx = idx;

                    const lastType = this.mobileUi.uiCurrentLayout[this.mobileUi.lastDragIdx];
                    if (lastType) {
                        lastType.el.classList.remove('selected');
                    }

                    this.mobileUi.lastDragIdx = idx;
                    this.mobileUi.dragActive = true;

                    const type = this.mobileUi.uiCurrentLayout[idx];
                    type.el.classList.add('drag');
                    type.el.classList.add('selected');

                    const rect = type.el.getBoundingClientRect();
                    this.mobileUi.dragOffset = { x: e.clientX - rect.x, y: e.clientY - rect.y };
                }
            },

            uiElTouchEnd(e) {
                if (this.mobileUi.dragIdx !== null) {
                    e.preventDefault();
                    this.mobileUi.uiCurrentLayout[this.mobileUi.dragIdx].el.classList.remove('drag');
                    this.mobileUi.dragIdx = null;
                    this.mobileUi.dragActive = false;
                }
            },

            uiElTouchMove(e) {
                if (this.mobileUi.dragIdx !== null) {
                    e.preventDefault();

                    // activate save/cancel buttons
                    this.customUiChanged = true;
                    this.customUiDefaultChanged = true;

                    // Set el x and y values
                    const control = this.mobileUi.uiCurrentLayout[this.mobileUi.dragIdx]
                    control.x = e.clientX - this.mobileUi.dragOffset.x / control.scale;
                    control.y = e.clientY - this.mobileUi.dragOffset.y / control.scale;

                    // Set the ui element position
                    this.setUiElPos(control.el, control.x, control.y, control.scale);
                }
            },

            uiTouchCancel() {
                this.mobileUi.dragIdx = null;
                this.mobileUi.dragActive = false;
            },

            uiSaveLayout() {
                this.mobileUi.confirmSafe = false;
                if (this.customUiChanged) {
                    BAWK.play('ui_playconfirm');

                    var uiLayout = this.mobileUi.uiCurrentLayout;

                    var objectEquals = function(o1, o2, ignore){
                        for(var p in o1){
                            if(o1.hasOwnProperty(p) && ignore.indexOf(p) == -1){
                                if(o1[p] !== o2[p]){
                                    return false;
                                }
                            }
                        }
                        for(var p in o2 && ignore.indexOf(p) == -1){
                            if(o2.hasOwnProperty(p)){
                                if(o1[p] !== o2[p]){
                                    return false;
                                }
                            }
                        }
                        return true;
                    };

                    for(var i = 0; i < uiLayout.length; i++) {
                        const orig = this.mobileUi.uiLayoutDefault[i];
                        const saving = uiLayout[i];

                        if (!objectEquals(orig, saving, ['el', '__ob__'])) {
                            ga('send', 'event', 'settings-mobile', 'custom_ui_button_modified', orig.control);
                        }
                    }

                    if (this.customUiDefaultChanged) {
                        const storedLayout = [];
                        for (const type of uiLayout) {
                            storedLayout.push({ control: type.control, x: type.x, y: type.y, scale: type.scale });
                        }

                        localStore.setItem(this.mobileUi.storedObj, JSON.stringify(storedLayout));
                    } else {
                        localStore.removeItem(this.mobileUi.storedObj);
                    }
                    
                    this.customUiChanged = false;
					ga('send', 'event', 'settings-mobile', 'custom_ui_save', 'click');
                }
            },

            uiCustomSharedClose() {
                BAWK.play('ui_popupclose');
                this.mobileUi.confirmSave = false;
                this.removeUiCustomListeners();
                this.disableUiCustom();
                this.$refs.uiCustomPopup.close();
                this.onSharedPopupClosed();
            },

            uiDefaultLayout() {
                BAWK.play('ui_onchange');

                this.uiLoadLayout(this.mobileUi.uiLayoutDefault);
                this.customUiChanged = true;
                this.customUiDefaultChanged = false;
                this.mobileUi.confirmSave = false;
            },

            uiCancelLayout() {

                     if (storedLayout) {

            saveAutofire() {
                BAWK.play('ui_playconfirm');

                const values = this.$refs.autofirePopup.$children[0].values;
                localStore.setItem(this.mobileUi.autofireStoreKey, JSON.stringify(values));

                var keys = Object.keys(values);
                for (var i = 0; i < keys.length; i++) {
                    ga('send', 'event', 'settings_autofire', values[keys[i]] ? 'autofire' : 'manualfire', keys[i]);
                }

                this.$refs.autofirePopup.close();
            },

            defaultAutofire() {
                BAWK.play('ui_onchange');

                this.mobileUi.autofire = Object.assign({}, this.mobileUi.autofireDefault);

                this.$refs.autofirePopup.$forceUpdate();
            },

            cancelAutofire() {
                BAWK.play('ui_popupclose');

                this.loadAutofireSettings();
				this.onSharedPopupClosed();
            },

            loadAutofireSettings() {
                var stored = localStore.getItem(this.mobileUi.autofireStoreKey);
                if (stored) {
                    this.mobileUi.autofire = JSON.parse(stored);
                } else {
                    this.mobileUi.autofire = Object.assign({}, this.mobileUi.autofireDefault);
                }
            },

            uiInGameDpadListeners() {

                this.disableUiCustom();
                this.activateIngameUi();

                this.$nextTick(() => {
                    this.uiInit();
                    extern.addDpadListeners();
                }
                );
            },
			useTags(val) {
				this.ui.socialMedia.selected = val.socialMedia;
				this.ui.premiumFeaturedTag = val.premFeat;
			},
            showVipPopup: function () {
                this.hideGameMenu();
                BAWK.play('ui_popupopen');
                this.$refs.vipPopup.show();
            },
            showSubStorePopup: function () {
                this.$nextTick(() => {
                    this.hideGameMenu();
                    this.$refs.subStorePopup.show();
                    BAWK.play('ui_popupopen');
                });
            },
            vipEndedPopup() {
                this.$refs.vipEnded.show();
                BAWK.play('ui_popupopen');
            },
			onVipHelpClosed() {
				this.onSharedPopupClosed();
				this.showSubStorePopup();
			},

			getLocLang(val) {
				let data = this.loc,
					langSetup = {};
				if (val) data = val;

				const newLoc = Object.entries(data).filter(item => item[0].includes('locLang')).forEach(lang => langSetup[lang[0].split('_').pop('').split("-").pop('')] = lang[1]);
				this.$nextTick(() => {
					this.locLanguage = langSetup
				});
			},
			onAccountDelectionConfirmed() {
				this.$refs.help.onAccountDelectionConfirmed();
			},
			showDeleteAccoutApprovalPopup() {
				this.$refs.deleteAccountApprovalPopup.show();
			},
			resetFeedbackType(){
				this.feedbackSelected = 0;
			},
			showHelpPopupFeedbackWithDelete() {
				this.$refs.help.openFeedbackTabWith(this.feedbackType.delete.id);
				this.showHelpPopup();
			},
			weaponIdx(idx) {
				this.mobileUi.weaponIdx = idx;
			},
			setInGame(val) {
				this.game.on = val;
			},
			setPause(val) {
				this.game.isPaused = val;
			}
        },
        computed: {
            classObject() {
                return {
                    'playing-poki': this.isPoki,
                    'is-mobile': this.isMobile,
                    'is-vip': this.isSubscriber && this.isUpgraded ? true : false,
                }
            },
            customUiBtnGroup() {
                return this.customUiDefaultChanged ? 'grid-column-3-eq' : 'grid-column-2-eq';
            },
			notEnoughEggs() {
				if (this.isAnonymous) return this.loc.ok;
				return this.loc.p_buy_isf_content;
			},
			needsMoreEggsConfrimTxt() {
				if (this.isAnonymous) return this.loc.ok;
				return this.loc.account_title_eggshop
			},
			needMoreEggsSigninContent() {
				if (this.isAnonymous) return this.loc.p_buy_isf_content_mobile_pt2;
			},
			accountStatus() {
				if (this.isAnonymous) {
					return this.isAnonymous && hasValue(this.firebaseId) ? 'anon' : 'no-account';
				} else {
					return hasValue(this.firebaseId) ? 'signed-in' : 'no-account';
				}
			},
        },
        watch: {
            isPaused(val) {
                if (!val)
                    return this.hideRespawnDisplayAd();
            },
            accountSettled(val) {
                if (val) {

                }
            },
			loc(val) {
				this.getLocLang(val);
			},
			
        }
    });
}
</script>

	</body>
</html>
